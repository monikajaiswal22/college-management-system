<!DOCTYPE html>
<html>
<head>
    <title>Admin Login | Elite University</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 50%, #a7f3d0 100%);
    overflow: hidden;
    position: relative;
}

/* Floating circles - subtle */
body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.08);
    animation: float 8s infinite ease-in-out;
}

body::before {
    width: 300px;
    height: 300px;
    top: -100px;
    left: -100px;
}

body::after {
    width: 400px;
    height: 400px;
    bottom: -150px;
    right: -150px;
    animation-delay: 3s;
}

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(5deg); }
}

/* ===== LOGIN BOX ===== */
.login-box {
    width: 400px;
    padding: 40px;
    border-radius: 24px;
    background: white;
    box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
    text-align: center;
    animation: fadeIn 0.5s ease;
    border: 1px solid #e2e8f0;
    position: relative;
    z-index: 1;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Icon */
.icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 32px;
    box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
}

.icon i {
    color: white;
}

/* Title */
h3 {
    color: #1e293b;
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 25px;
    letter-spacing: -0.02em;
}

h3 i {
    color: #10b981;
    margin-right: 8px;
}

/* Form Controls */
.form-control {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    color: #1e293b;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.9rem;
    transition: all 0.2s ease;
}

.form-control::placeholder {
    color: #94a3b8;
}

.form-control:focus {
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    border-color: #10b981;
    background: white;
}

/* Login Button */
.btn-login {
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.2s ease;
    color: white;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
}

/* Back Link */
.back-link {
    margin-top: 20px;
    display: inline-block;
    color: #64748b;
    text-decoration: none;
    font-size: 0.85rem;
    transition: all 0.2s ease;
}

.back-link:hover {
    color: #10b981;
    transform: translateX(-3px);
}

.back-link i {
    margin-right: 5px;
}

/* Error Message */
.alert-error {
    background: #fef2f2;
    border-left: 3px solid #ef4444;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
    color: #dc2626;
    font-size: 0.85rem;
    text-align: left;
}

/* Footer Text */
.footer-text {
    margin-top: 25px;
    font-size: 0.7rem;
    color: #94a3b8;
}

.footer-text i {
    color: #10b981;
}

/* Responsive */
@media (max-width: 480px) {
    .login-box {
        width: 90%;
        padding: 30px 20px;
    }
    
    .icon {
        width: 60px;
        height: 60px;
        font-size: 28px;
    }
    
    h3 {
        font-size: 1.3rem;
    }
}
</style>
</head>

<body>

<div class="login-box">
    <div class="icon">
        <i class="bi bi-shield-lock-fill"></i>
    </div>

    <h3>
        <i class="bi bi-person-badge"></i> Admin Login
    </h3>

    {% if error %}
    <div class="alert-error">
        <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>

        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>

        <button type="submit" class="btn btn-login w-100">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </button>
    </form>

    <a href="/" class="back-link">
        <i class="bi bi-arrow-left"></i> Back to Home
    </a>

    <div class="footer-text">
        <i class="bi bi-shield-check"></i> Secure Login | Elite University
    </div>
</div>

</body>
</html>
