<!DOCTYPE html>
<html>
<head>
    <title>Edit Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <div class="card-header bg-success text-white">
                <i class="fas fa-edit"></i> Edit Subject
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label>Subject Name</label>
                        <input type="text" name="name" value="{{ subject['name'] }}" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Course</label>
                        <input type="text" name="course" value="{{ subject['course'] }}" class="form-control" required>
                    </div>
<div class="mb-3">
                        <label>Semester</label>
                        <input type="number" name="semester" value="{{ subject['semester'] }}" class="form-control" min="1" max="8" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Update Subject</button>
                    <a href="/subjects" class="btn btn-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
