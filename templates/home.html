<!DOCTYPE html>
<html>
<head>
    <title>College Management System | Dashboard Portal</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ===== RESET & BASE ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(145deg, #dbeafe 0%, #bfdbfe 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow-x: hidden;
}

/* Animated background elements - Soft blue */
body::before {
    content: '';
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.2), transparent 70%);
    top: -200px;
    right: -200px;
    border-radius: 50%;
    animation: float1 20s ease-in-out infinite;
}

body::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(96, 165, 250, 0.15), transparent 70%);
    bottom: -150px;
    left: -150px;
    border-radius: 50%;
    animation: float2 18s ease-in-out infinite;
}

@keyframes float1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-50px, 50px) scale(1.1); }
}

@keyframes float2 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(50px, -50px) scale(1.15); }
}

/* Soft grid pattern */
.grid-pattern {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
    z-index: 0;
}

/* ===== MAIN CARD - WHITE WITH BLUE SHADOW ===== */
.container-box {
    position: relative;
    z-index: 10;
    background: rgba(255, 255, 255, 0.98);
    backdrop-filter: blur(10px);
    border-radius: 2rem;
    padding: 3rem 2.5rem;
    width: 480px;
    max-width: 90%;
    text-align: center;
    border: 1px solid rgba(59, 130, 246, 0.2);
    box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25);
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Logo/Badge - Blue gradient */
.logo-badge {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
}

.logo-badge i {
    font-size: 42px;
    color: white;
}

/* Title - Blue gradient text */
h1 {
    font-size: 1.75rem;
    font-weight: 700;
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 0.5rem;
    letter-spacing: -0.02em;
}

.subtitle {
    color: #6b7280;
    font-size: 0.85rem;
    margin-bottom: 2rem;
    font-weight: 400;
}

/* ===== BUTTONS - White with blue accents ===== */
.btn-custom {
    width: 100%;
    padding: 0.9rem 1.5rem;
    margin: 0.65rem 0;
    border: none;
    border-radius: 1rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
    color: white;
}

.btn-custom i {
    font-size: 1.2rem;
    transition: transform 0.2s ease;
}

.btn-custom:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
}

.btn-custom:hover i {
    transform: scale(1.1);
}

.btn-custom:active {
    transform: translateY(1px);
}

/* Button variants - Blue shades */
.btn-student {
    background: linear-gradient(135deg, #10b981, #34d399);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
}

.btn-teacher {
    background: linear-gradient(135deg, #3b82f6, #60a5fa);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25);
}

.btn-admin {
    background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
}

/* Divider */
.divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 1.5rem 0 0.5rem;
    color: #c7d2fe;
    font-size: 0.75rem;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid rgba(59, 130, 246, 0.15);
}

.divider span {
    padding: 0 0.75rem;
    color: #6b7280;
}

/* Footer text */
.footer-text {
    margin-top: 1.5rem;
    font-size: 0.7rem;
    color: #9ca3af;
}

.footer-text i {
    font-size: 0.65rem;
    color: #3b82f6;
}

/* Version badge - Light */
.version-badge {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(5px);
    padding: 0.25rem 0.75rem;
    border-radius: 1rem;
    font-size: 0.7rem;
    color: #3b82f6;
    z-index: 10;
    font-family: monospace;
    border: 1px solid rgba(59, 130, 246, 0.2);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
}

.version-badge i {
    color: #3b82f6;
    margin-right: 4px;
}

/* Responsive */
@media (max-width: 520px) {
    .container-box {
        padding: 2rem 1.5rem;
        width: 90%;
    }
    
    h1 {
        font-size: 1.4rem;
    }
    
    .btn-custom {
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
    }
    
    .logo-badge {
        width: 65px;
        height: 65px;
    }
    
    .logo-badge i {
        font-size: 34px;
    }
}

/* Hover glow effect - Light */
.btn-custom::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s ease;
}

.btn-custom:hover::before {
    left: 100%;
}

/* Card hover effect */
.container-box:hover {
    border-color: rgba(59, 130, 246, 0.4);
    box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.35);
    transform: translateY(-3px);
    transition: all 0.3s ease;
}

/* Button icons spacing */
.btn-custom .fa-arrow-right {
    margin-left: auto;
}

</style>
</head>
<body>

<div class="grid-pattern"></div>

<div class="container-box">
    
    <div class="logo-badge">
        <i class="fas fa-graduation-cap"></i>
    </div>
    
    <h1>College Management System</h1>
    <div class="subtitle">Centralized Academic Portal</div>
    
    <a href="/student-login" style="text-decoration: none;">
        <button class="btn-custom btn-student">
            <i class="fas fa-user-graduate"></i>
            Student Login
            <i class="fas fa-arrow-right"></i>
        </button>
    </a>
    
    <a href="/teacher-login" style="text-decoration: none;">
        <button class="btn-custom btn-teacher">
            <i class="fas fa-chalkboard-user"></i>
            Teacher Login
            <i class="fas fa-arrow-right"></i>
        </button>
    </a>
    
    <a href="/admin-login" style="text-decoration: none;">
        <button class="btn-custom btn-admin">
            <i class="fas fa-user-tie"></i>
            Admin Login
            <i class="fas fa-arrow-right"></i>
        </button>
    </a>
    
    <div class="divider">
        <span>Secure Access Only</span>
    </div>
    
    <div class="footer-text">
        <i class="fas fa-shield-alt"></i> Authorized Personnel Only
    </div>
</div>

<div class="version-badge">
    <i class="fas fa-cloud"></i> v2.0 | ERP System
</div>

<script>
// Smooth hover effect for arrow icons
document.querySelectorAll('.btn-custom').forEach(btn => {
    const arrow = btn.querySelector('.fa-arrow-right');
    if (arrow) {
        arrow.style.transition = 'all 0.3s ease';
        arrow.style.opacity = '0.7';
        arrow.style.marginLeft = '8px';
        
        btn.addEventListener('mouseenter', () => {
            arrow.style.transform = 'translateX(5px)';
            arrow.style.opacity = '1';
        });
        
        btn.addEventListener('mouseleave', () => {
            arrow.style.transform = 'translateX(0)';
            arrow.style.opacity = '0.7';
        });
    }
});
</script>

</body>
</html>
